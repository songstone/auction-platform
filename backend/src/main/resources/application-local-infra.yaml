spring:
  config:
    activate:
      on-profile: local-infra
  autoconfigure:
    exclude: []
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:55432/auction}
    username: ${DB_USER:auction}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
  sql:
    init:
      mode: never

# Flyway owns schema changes. Development fixtures are loaded explicitly outside the app.
# Mail and photo variables are preparation inputs, not active adapters.
