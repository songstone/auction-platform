spring:
  application:
    name: auction-platform-backend
  main:
    banner-mode: "off"
  flyway:
    enabled: false
  docker:
    compose:
      enabled: false
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
      include-exception: false
  autoconfigure:
    # The default bootstrap is independent of DB/mail/photo infrastructure.
    # local-infra enables JDBC with Compose service connections or an external DB.
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      # This scaffold exposes summary health only; readiness is a later implementation task.
      probes:
        enabled: false
