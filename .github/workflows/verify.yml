name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r contracts/requirements-validation.txt
      - run: python scripts/test-baseline-guard.py
      - run: python scripts/verify-contracts.py
      - uses: actions/upload-artifact@v4
        with:
          name: contract-static-report
          path: .artifacts/contracts/validation-report.json
  backend:
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle.kts
            backend/gradle.lockfile
            backend/gradle/wrapper/gradle-wrapper.properties
      - working-directory: backend
        run: bash ./gradlew --no-daemon --console=plain clean build integrationTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: backend/build/libs/auction-platform-backend-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
  frontend:
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-fund --no-audit
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-app
          path: frontend/dist/
          if-no-files-found: error
  integration:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r contracts/requirements-validation.txt
      - working-directory: frontend
        run: npm ci --no-fund --no-audit
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: backend-app
          path: backend/build/libs/
      - uses: actions/download-artifact@v4
        with:
          name: frontend-app
          path: frontend/dist/
      - run: python scripts/verify-integration.py --skip-build
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.artifacts/integration/**/SAFE_TO_UPLOAD') != ''
        with:
          name: public-round-integration-evidence
          path: |
            .artifacts/integration/
            .artifacts/tasks/T-003/
            output/playwright/
          include-hidden-files: true
