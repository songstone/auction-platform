openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: 4레인 실시간 경매 공통 계약
  version: 0.1.0
  description: USER_APPROVED / D-095의 범위로 구현 기준선 승인. 제품 1.6과 SYSTEM-DESIGN 1.0에 기반한 HTTP 및 이벤트 payload 원본. 정의된 경로·wire·처리/복구 의미를 채택하고 남은 OPEN·deferred·미검증 위험은 유지한다. 기능
    구현/성능/장애 검증은 NOT_RUN. x-open-decisions는 미정 제품 세부, x-draft-status는 초안 완성도, x-verification-status는 실행 증거를 구분한다.
    제한 미기재는 무제한 허용 정책이 아니다. 추가 실험은 초안 작성이나 사용자 계약 승인에 대한 일괄 선행조건이 아니다. 이벤트 전송 의미는 auction-events.md, 변경 절차와 잔여 사항은
    README.md.
servers:
- url: /api/v1
  description: 같은 출처의 버전 경로. 실제 배포 주소·서비스는 아직 없음.
tags:
- name: Identity
- name: Public
- name: Listings
- name: Bidding
- name: Results
- name: Operations
- name: Realtime
security: []
x-contract-status: USER_APPROVED
x-verification-status: NOT_RUN
x-approval:
  decisionId: D-095
  source: ../docs/decisions/DECISION-LOG.md
  approvedOn: '2026-10-15'
  approvedFrom: 0.1.0-draft.2
  baseline: approved-baseline-0.1.0.json
  scope: 정의된 경로·스키마·권한/오류·입찰 접수/판정/ACK·이벤트/복구 의미의 구현 기준선. OPEN의 미선택 값·추가 권한·deferred 표면과 실행/운영 보장은 포함하지 않는다.
x-approved-policy-decisions:
  source: ../docs/decisions/DECISION-LOG.md
  ids:
  - D-092
  - D-093
  - D-094
  scope: 제품 정책 승인 참조. 설계·계약 채택 승인은 x-approval의 D-095로 구분한다.
x-request-identities:
  BID: memberId + requestId. 등록/실제 접수/원판정/ACK가 공유하는 이름공간. 원 auctionId·amount 고정.
  MEMBER_ACTION: memberId + requestId. 모든 출품 변경 종류 사이 같은 키 공유·종류/원내용 고정.
  OPERATOR_COMMAND: operatorId + requestId. 모든 운영 명령 종류 사이 같은 키 공유·종류/원대상/제출 사유/해제 발생 건 고정.
  rule: 서로 다른 이름공간은 같은 문자열을 쓸 수 있으나 하나의 이름공간에서는 재사용해 새 효과를 만들지 않는다. 회차/현재 화면/stream 세대로 원키를 재분류하지 않는다. 사진 업로드/로그인처럼
    원키 없는 작업은 이 멱등성 보장 대상이 아니다.
x-authorization-policy: MEMBER는 이메일 검증 가입 완료 회원. OPERATOR는 명시 지정 운영 전용 계정이며 MEMBER와 겸용하지 않는다(D-092). 한 계정의 역할은 둘 중 하나다.
  AUTHENTICATED는 현재 세션 주체. 권한 없는 원요청·개인정보 조회는 거절.
x-http-policy:
  requestMediaType: application/json (사진 제외)
  responseCacheControl: no-store
  sensitiveData: 비밀번호·세션·검증/재설정 토큰·이메일을 로그/URL에 기록하지 않음
  unknownResponseFields: 현재 기준선 객체는 additionalProperties=false인 닫힌 스키마다. 알 수 없는 필드·타입을 성공 적용으로 추정하지 않는다. 선택 필드 추가도
    strict 소비자 영향·호환성을 검토하고 승인한 계약 버전으로 반영한다.
x-open-decisions:
- id: OPEN-01
  pending: 일정 입력 정밀도·미래 범위·변경 검증 상세
  scope:
  - createRound
  - updateRoundSchedule
- id: OPEN-05
  pending: 가격/시간 범위·단위 후보·사진/문자 제한. 최저낙찰가 단위 정렬 불필요는 D-093으로 확정
  scope:
  - CreateLotRequest
  - UpdateLotRequest
  - UploadPhotoRequest
  - DurationSettings
- id: OPEN-06
  pending: 계정 판정/수명·세션·인증/재설정 보안 상세. 운영 전용 계정 분리는 D-092로 확정
  scope:
  - Identity
  - TradeContact
- id: OPEN-07
  pending: 낙찰자 필드·입찰 이력·운영자 개인정보 관리권한. 유찰 결과 최고입찰가 미노출은 D-094로 확정
  scope:
  - x-deferred-surfaces
- id: OPEN-09
  pending: 장애 증거·확인/이력 복원관리의 상세
  scope:
  - confirmRecovery
  - resumeLane
  - x-deferred-surfaces
- id: OPEN-10
  pending: 시각/순번/기록 보장·키 생성/운영 제한·재시도 수치·프로토콜 실제 원자성
  scope:
  - ADR-001
  - ADR-002
  - ADR-003
  - Realtime
- id: OPEN-12
  pending: 운영 보존/삭제·연락처 접근 종료
  scope:
  - TradeContact
  - replay-retention
- id: OPEN-02
  pending: 일정 지연 안내 표현
  scope:
  - consumer UX
- id: OPEN-08
  pending: 지원 브라우저/화면·자동 결과 표시
  scope:
  - consumer UX
- id: OPEN-13
  pending: 시험 조건·측정 경계·실패 표본 처리
  scope:
  - acceptance evidence
- id: OPEN-14
  pending: 실제 거래 운영의 품목·악용·불이행/분쟁/책임
  scope:
  - before actual operation
x-deferred-surfaces:
- path: /api/v1/listing-options
  methods:
  - GET
  knownAuthorization: 출품 흐름의 회원
  openDecisions:
  - OPEN-05
  reason: 입찰 단위 후보 공급 필드/값은 미정. 후보 기본 선택·직접 입력이라는 승인 흐름은 유지하며 임의 후보값을 예제 제품 정책으로 넣지 않음.
- path: /api/v1/auctions/{auctionId}/winner
  methods:
  - GET
  knownAuthorization: 해당 출품자·낙찰자·운영자
  openDecisions:
  - OPEN-07
  reason: 식별 응답 필드 미정. 빈 성공 스키마나 임의 회원 필드를 추가하지 않음.
- path: /api/v1/auctions/{auctionId}/bids
  methods:
  - GET
  knownAuthorization: 접근 범위 미정
  openDecisions:
  - OPEN-07
  reason: 개별 입찰 이력 공개/관리 범위 미정. 새 MVP 필수 분석 기능 승인 아님.
- path: /api/v1/operator/rounds/{roundId}/lanes/{laneId}/history-evidence
  methods:
  - POST
  knownAuthorization: 상세 관리 권한 미정
  openDecisions:
  - OPEN-06
  - OPEN-09
  - OPEN-10
  reason: 이력 증거 보완/재검증 절차·payload/감사 미정. historyComplete=true 덮어쓰기 API를 만들지 않음.
- path: null
  methods: []
  knownAuthorization: 필요성 미확정
  openDecisions:
  - OPEN-07
  reason: 운영자 거래 이메일·비공개 최저금액·타회원 개인목록 조회는 권한을 임의 부여하지 않음.
paths:
  /auth/csrf:
    get:
      operationId: getCsrfToken
      tags:
      - Identity
      summary: CSRF 토큰 확보
      description: 로그인 전에도 세션/CSRF 준비 가능. 반환 토큰은 메모리에서 보관하고 변경 요청 X-CSRF-Token에 전달. 로그인/로그아웃 뒤 재취득. 쿠키 속성·세션 수명은
        OPEN-06의 제안 범위.
      security: []
      x-required-role: PUBLIC
      x-draft-status: draft-with-open-policy
      x-verification-status: NOT_RUN
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          headers:
            Cache-Control:
              description: JSON 및 동적 응답은 no-store.
              schema:
                type: string
                const: no-store
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
