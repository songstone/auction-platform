    ProblemCode:
      type: string
      enum:
      - VALIDATION_FAILED
      - AUTHENTICATION_REQUIRED
      - AUTHENTICATION_FAILED
      - ROLE_REQUIRED
      - EMAIL_NOT_VERIFIED
      - CSRF_INVALID
      - RESOURCE_NOT_FOUND
      - REQUEST_RECORD_NOT_FOUND
      - CONTENT_CONFLICT
      - UNCONFIRMED_INTENT_EXISTS
      - INTENT_NOT_REGISTERED
      - OUTCOME_NOT_FINAL
      - OUTCOME_MISMATCH
      - RATE_LIMITED
      - SERVICE_UNAVAILABLE
      - COMMIT_RESULT_UNKNOWN
      - RECOVERY_REVIEW_REQUIRED
      - INTERNAL_ERROR
      x-code-meanings:
        VALIDATION_FAILED: 필수·형식·이미 승인된 기본 입력 관계 위반
        AUTHENTICATION_REQUIRED: 로그인 필요/세션 만료
        AUTHENTICATION_FAILED: 이메일·비밀번호 인증 실패; 계정 존재 여부나 상세 실패 이유 노출 없음
        ROLE_REQUIRED: 해당 명시 역할 없음
        EMAIL_NOT_VERIFIED: 가입 완료 권한 전 이메일 미검증
        CSRF_INVALID: 변경 요청 CSRF 없음/불일치
        RESOURCE_NOT_FOUND: 대상 없음 또는 이 조회 권한에 공개되지 않음
        REQUEST_RECORD_NOT_FOUND: 해당 권위 조회에서 본인 원요청 기록 못 찾음; 최종 거절·영구 미접수 아님
        CONTENT_CONFLICT: 같은 행위자+키에 종류/원경매/금액/원대상/사유 등 내용 불일치; 원판정 유지
        UNCONFIRMED_INTENT_EXISTS: 같은 회원×Auction의 다른 미확인 의도 존재
        INTENT_NOT_REGISTERED: 실제 입찰 전에 같은 의도 등록 확인 필요
        OUTCOME_NOT_FINAL: 원최종 판정 없는 ACK, 제한 해제 없음
        OUTCOME_MISMATCH: ACK의 outcomeId가 해당 원최종 판정과 다름
        RATE_LIMITED: 기술적 재시도/요청 제한, 수치 미정; 원요청 효과 추정 금지
        SERVICE_UNAVAILABLE: 정상 처리 불가, 원키 복구
        COMMIT_RESULT_UNKNOWN: 저장 결과 불명, 같은 키 조회/재전송
        RECOVERY_REVIEW_REQUIRED: 권위 증거 확인 필요; 추정 원거절·정상 결과로 대체 금지
        INTERNAL_ERROR: 내부 오류, 최종 업무 거절 아님
    FieldViolation:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
      required:
