server.address=127.0.0.1
server.port=${SPIKE_PORT:18081}
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=8
spring.datasource.url=${SPIKE_DB_URL:jdbc:postgresql://127.0.0.1:15432/spike001}
spring.datasource.username=spike
spring.datasource.password=${SPIKE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=never
spring.mvc.async.request-timeout=0
spring.task.scheduling.pool.size=8
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.spike=INFO
server.error.include-message=never
spike.manual=true
spike.recover-on-start=false
